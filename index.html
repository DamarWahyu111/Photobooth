<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estetik Photobooth</title>
    
    <!-- Menggunakan Static CSS Tailwind agar sangat stabil dan anti-diblokir -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="w-full max-w-4xl mx-auto pt-8 pb-4 px-6 flex justify-between items-center z-10">
        <div>
            <h1 class="text-3xl font-serif font-bold text-gray-800 tracking-tight">Kamera.</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Estetik Photobooth</p>
        </div>
        <div id="nav-actions" class="flex items-center gap-4 hidden">
            <button id="btn-back-home" class="text-sm font-medium text-gray-500 hover:text-gray-800 transition-colors bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200">
                ← Ganti Frame
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center px-4 pb-12 w-full max-w-4xl mx-auto relative overflow-hidden">
        
        <section id="view-home" class="w-full flex flex-col animate-fade-in">
            <div class="text-center mb-8 mt-2">
                <h2 class="text-xl font-medium text-gray-700">Pilih Desain Frame</h2>
                <p class="text-sm text-gray-500 mt-1">Tersedia 10 pilihan estetik. Pilih sebelum memotret.</p>
            </div>

            <!-- Area Pilihan Frame (Di-generate via JS agar lebih ringan) -->
            <div class="relative w-full mb-10">
                <button id="btn-scroll-left" class="absolute left-0 top-1/2 transform -translate-y-1/2 -ml-2 sm:-ml-4 bg-white shadow-lg border border-gray-100 text-gray-800 p-2 rounded-full z-10 hover:bg-gray-50 transition focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                
                <div class="flex overflow-x-auto gap-4 w-full hide-scrollbar snap-x snap-mandatory pb-4 px-2" id="frame-options-container" style="scroll-behavior: smooth;">
                </div>

                <button id="btn-scroll-right" class="absolute right-0 top-1/2 transform -translate-y-1/2 -mr-2 sm:-mr-4 bg-white shadow-lg border border-gray-100 text-gray-800 p-2 rounded-full z-10 hover:bg-gray-50 transition focus:outline-none">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <button id="btn-open-camera" class="w-full mx-auto bg-gray-800 text-white font-medium py-4 rounded-2xl shadow-lg hover:bg-gray-700 btn-press transition-all flex items-center justify-center gap-3" style="max-width: 24rem;">
                <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-lg">Buka Kamera</span>
            </button>
        </section>

        <section id="view-camera" class="w-full hidden flex-col items-center animate-fade-in">
            
            <div class="relative w-full max-w-md bg-gray-900 rounded-2xl overflow-hidden shadow-2xl mb-6 border-white" style="aspect-ratio: 3/4; border-width: 6px;">
                <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
                
                <div id="strip-progress" class="absolute top-5 left-0 right-0 flex justify-center gap-3 opacity-0 transition-opacity duration-300 z-20">
                    <div class="w-3 h-3 rounded-full bg-white bg-opacity-40 progress-dot" id="dot-1"></div>
                    <div class="w-3 h-3 rounded-full bg-white bg-opacity-40 progress-dot" id="dot-2"></div>
                    <div class="w-3 h-3 rounded-full bg-white bg-opacity-40 progress-dot" id="dot-3"></div>
                    <div class="w-3 h-3 rounded-full bg-white bg-opacity-40 progress-dot" id="dot-4"></div>
                </div>

                <div id="countdown-display" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-50 hidden z-20 backdrop-blur-sm">
                    <span id="countdown-text" class="text-8xl font-serif text-white drop-shadow-lg">3</span>
                    <span id="instruction-text" class="text-white text-opacity-90 text-sm mt-4 font-medium tracking-widest uppercase">Bersiaplah</span>
                </div>

                <div id="flash-effect" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-75 z-30"></div>
            </div>

            <div id="camera-controls" class="w-full max-w-md bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5" style="font-size: 10px;">Kamera Perangkat</label>
                        <select id="camera-select" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-gray-500 focus:border-gray-500 p-3 outline-none transition appearance-none">
                            <option value="">Mendeteksi...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5" style="font-size: 10px;">Filter Estetik</label>
                        <!-- Pilihan 12 Filter (termasuk B&W) -->
                        <select id="filter-select" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-gray-500 focus:border-gray-500 p-3 outline-none transition appearance-none">
                            <option value="none">Normal</option>
                            <option value="grayscale(1) contrast(1.2)">Classic B&W</option>
                            <option value="grayscale(1) contrast(1.5) brightness(0.9)">Dark B&W</option>
                            <option value="grayscale(1) contrast(0.9) brightness(1.1)">Soft B&W</option>
                            <option value="sepia(0.4) contrast(1.1) saturate(1.2)">Warm Vintage</option>
                            <option value="sepia(0.8) contrast(1.1)">Sepia Classic</option>
                            <option value="sepia(0.2) hue-rotate(-10deg) saturate(1.4)">Film Analog</option>
                            <option value="hue-rotate(15deg) saturate(0.8) contrast(1.1) brightness(0.95)">Cinematic Muted</option>
                            <option value="contrast(0.9) brightness(1.15) saturate(1.3) sepia(0.1)">Dreamy Pastel</option>
                            <option value="contrast(1.3) saturate(1.5) sepia(0.2) hue-rotate(-15deg)">Retro 90s</option>
                            <option value="hue-rotate(180deg) saturate(1.2) brightness(0.9)">Cool Blue</option>
                            <option value="contrast(0.8) brightness(1.1) saturate(0.8)">Faded Matte</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100 mb-6">
                    <div class="flex items-center gap-3">
                        <svg style="width: 20px; height: 20px;" class="text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <span class="text-sm font-medium text-gray-700">Mode Malam (Terang)</span>
                    </div>
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="night-mode-toggle" class="sr-only toggle-checkbox">
                            <div class="toggle-label block"></div>
                        </div>
                    </label>
                </div>

                <button id="btn-start-capture" class="w-full bg-gray-800 text-white font-medium py-4 rounded-xl shadow-md hover:bg-gray-700 btn-press transition-all flex items-center justify-center gap-2">
                    <span id="btn-start-text" class="text-base font-bold">Mulai Memotret</span>
                </button>
            </div>
        </section>

        <section id="view-result" class="w-full hidden flex-col items-center">
            <div class="w-full max-w-md flex justify-between items-center mb-4 px-2">
                <h2 class="text-2xl font-serif font-bold text-gray-800">Hasil Foto.</h2>
                <button id="btn-retake" class="text-sm font-medium text-gray-600 hover:text-gray-900 flex items-center gap-1.5 transition-colors bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200">
                    <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Foto Ulang
                </button>
            </div>

            <!-- Fitur Ganti Filter Pasca-Pemotretan -->
            <div class="w-full max-w-md bg-white p-3 rounded-xl border border-gray-200 mb-6 flex items-center justify-between shadow-sm animate-fade-in">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wider ml-2" style="font-size: 10px;">Ganti Filter:</label>
                <select id="post-filter-select" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-gray-500 focus:border-gray-500 p-2 outline-none transition appearance-none w-2/3">
                    <option value="none">Normal</option>
                    <option value="grayscale(1) contrast(1.2)">Classic B&W</option>
                    <option value="grayscale(1) contrast(1.5) brightness(0.9)">Dark B&W</option>
                    <option value="grayscale(1) contrast(0.9) brightness(1.1)">Soft B&W</option>
                    <option value="sepia(0.4) contrast(1.1) saturate(1.2)">Warm Vintage</option>
                    <option value="sepia(0.8) contrast(1.1)">Sepia Classic</option>
                    <option value="sepia(0.2) hue-rotate(-10deg) saturate(1.4)">Film Analog</option>
                    <option value="hue-rotate(15deg) saturate(0.8) contrast(1.1) brightness(0.95)">Cinematic Muted</option>
                    <option value="contrast(0.9) brightness(1.15) saturate(1.3) sepia(0.1)">Dreamy Pastel</option>
                    <option value="contrast(1.3) saturate(1.5) sepia(0.2) hue-rotate(-15deg)">Retro 90s</option>
                    <option value="hue-rotate(180deg) saturate(1.2) brightness(0.9)">Cool Blue</option>
                    <option value="contrast(0.8) brightness(1.1) saturate(0.8)">Faded Matte</option>
                </select>
            </div>

            <!-- Kontainer Foto Final -->
            <div id="result-container" class="bg-white p-3 rounded-2xl shadow-xl border border-gray-200 mx-auto animate-slide-up mb-8 hover:-translate-y-1 transition-all duration-300 flex justify-center w-full" style="max-width: 320px;">
                <img id="final-strip-img" src="" alt="Hasil" class="w-full h-auto rounded-lg shadow-sm">
            </div>

            <div class="w-full max-w-md grid grid-cols-1 gap-3 sm:grid-cols-3 animate-slide-up" style="animation-delay: 0.1s;">
                <button id="btn-download" class="flex items-center justify-center gap-2 bg-gray-800 text-white px-4 py-3.5 rounded-xl hover:bg-gray-700 transition-colors shadow-sm w-full">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="font-bold text-sm tracking-wide">Simpan</span>
                </button>
                <button id="btn-print" class="flex items-center justify-center gap-2 bg-white border-2 border-gray-200 text-gray-800 px-4 py-3.5 rounded-xl hover:bg-gray-50 transition-colors shadow-sm w-full">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span class="font-bold text-sm tracking-wide">Cetak</span>
                </button>
                <button id="btn-share" class="flex items-center justify-center gap-2 bg-white border-2 border-gray-200 text-gray-800 px-4 py-3.5 rounded-xl hover:bg-gray-50 transition-colors shadow-sm w-full">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    <span class="font-bold text-sm tracking-wide">Bagikan</span>
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 mt-6">*Sistem otomatis mengunduh foto saat proses selesai.</p>
        </section>
    </main>

    <!-- Kontainer Notifikasi -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 flex flex-col gap-3 z-50 pointer-events-none w-max" style="max-width: 90%;"></div>

    <script src="script.js"></script>
</body>
</html>
